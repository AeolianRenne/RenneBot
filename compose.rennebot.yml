services:
  astrbot:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    image: rennebot-astrbot:local
    container_name: rennebot-astrbot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${BOT_ENV_FILE:-.env.rennebot}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      RENNEBOT_BOOTSTRAP_ADMIN_IDS: ${RENNEBOT_BOOTSTRAP_ADMIN_IDS:-}
      BANPICK_INTERNAL_URL: ${BANPICK_INTERNAL_URL:-http://banpick:8000}
      BANPICK_BOT_API_KEY: ${BANPICK_BOT_API_KEY:-}
    ports:
      # Dashboard and callback API remain accessible only over an SSH tunnel.
      - "127.0.0.1:6185:6185"
      - "127.0.0.1:6199:6199"
    volumes:
      - ${RUNTIME_DIR:-./runtime}/astrbot-data:/AstrBot/data
      - ./rennebot_plugin/qq_game_registry:/AstrBot/data/plugins/qq_game_registry:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 6185), 2).close()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
  banpick:
    build:
      context: ./lol-banpick
      args:
        BANPICK_NODE_BASE_IMAGE: ${BANPICK_NODE_BASE_IMAGE:-node:22-alpine}
        BANPICK_PYTHON_BASE_IMAGE: ${BANPICK_PYTHON_BASE_IMAGE:-python:3.12-slim}
        BANPICK_PIP_INDEX_URL: ${BANPICK_PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: rennebot-banpick
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${BOT_ENV_FILE:-.env.rennebot}
    environment:
      BANPICK_DATA_DIR: /data
      BANPICK_INTERNAL_URL: ${BANPICK_INTERNAL_URL:-http://banpick:8000}
      BANPICK_PUBLIC_BASE_URL: ${BANPICK_PUBLIC_BASE_URL:-http://localhost:8000}
      BANPICK_ADMIN_INITIAL_PASSWORD: ${BANPICK_ADMIN_INITIAL_PASSWORD:-change-me}
      BANPICK_BOT_API_KEY: ${BANPICK_BOT_API_KEY:-change-me}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${RUNTIME_DIR:-./runtime}/banpick-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
